<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>BlockVerse — Voxel Sandbox</title>
  <meta name="description" content="BlockVerse: an open-source voxel sandbox game in the browser. Explore, mine, craft, survive." />
  <meta name="theme-color" content="#121a24" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23866043'/%3E%3Crect width='16' height='5' fill='%235fa83a'/%3E%3Crect y='5' width='3' height='2' fill='%235fa83a'/%3E%3Crect x='7' y='5' width='4' height='2' fill='%235fa83a'/%3E%3Crect x='4' y='10' width='2' height='2' fill='%236b4a30'/%3E%3Crect x='11' y='12' width='2' height='2' fill='%236b4a30'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <!-- HUD (crosshair, hotbar, status bars, debug) -->
    <div id="hud" class="hidden">
      <div id="vignette"></div>
      <div id="fire-overlay" aria-hidden="true"></div>
      <div id="crosshair">+</div>
      <div id="attack-charge" class="hidden"><i></i></div>
      <div id="click-to-play" class="hidden">Click to play</div>
      <div id="bow-charge" class="hidden"><div></div></div>
      <div id="status-bars">
        <div id="armor-bar" class="stat-bar"></div>
        <div id="air-bar" class="stat-bar"></div>
        <div id="health-bar" class="stat-bar"></div>
        <div id="hunger-bar" class="stat-bar"></div>
      </div>
      <div id="hotbar"></div>
      <div id="held-item-label"></div>
      <div id="debug-overlay" class="hidden"></div>
      <div id="fps-counter" class="hidden"></div>
      <div id="toasts" aria-live="polite"></div>
      <div id="inventory-hint" class="hidden"></div>
      <div id="touch-controls" class="hidden"></div>
      <div id="chat-log"></div>
      <div id="sleep-fade"><span>Sleeping…</span></div>
      <div id="chat-input-row" class="hidden"><input id="chat-input" autocomplete="off" spellcheck="false" maxlength="256" aria-label="Chat or command" placeholder="Type a message, or /help for commands" /></div>
    </div>
    <!-- Full-screen UI layers -->
    <div id="ui-root"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
