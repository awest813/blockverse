<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>BlockVerse — Voxel Sandbox</title>
  <meta name="description" content="BlockVerse: an open-source voxel sandbox game in the browser. Explore, mine, craft, survive. No install, no account." />
  <meta name="theme-color" content="#121a24" />
  <meta name="color-scheme" content="dark" />
  <!-- link previews (chat apps, social sites) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BlockVerse" />
  <meta property="og:title" content="BlockVerse — Voxel Sandbox" />
  <meta property="og:description" content="An open-source voxel sandbox game that runs in your browser. Explore, mine, craft, survive. No install, no account." />
  <meta property="og:url" content="https://awest813.github.io/blockverse/" />
  <meta property="og:image" content="https://awest813.github.io/blockverse/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A sandy coastline, meadow and birch trees in BlockVerse" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- add to home screen (phones, tablets, Chromebooks) -->
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BlockVerse" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23866043'/%3E%3Crect width='16' height='5' fill='%235fa83a'/%3E%3Crect y='5' width='3' height='2' fill='%235fa83a'/%3E%3Crect x='7' y='5' width='4' height='2' fill='%235fa83a'/%3E%3Crect x='4' y='10' width='2' height='2' fill='%236b4a30'/%3E%3Crect x='11' y='12' width='2' height='2' fill='%236b4a30'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/style.css" />
  <noscript><style>.boot-loading { display: none; }</style></noscript>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <!-- HUD (crosshair, hotbar, status bars, debug) -->
    <div id="hud" class="hidden">
      <div id="vignette"></div>
      <div id="fire-overlay" aria-hidden="true"></div>
      <div id="frost-overlay" aria-hidden="true"></div>
      <div id="crosshair">+</div>
      <div id="attack-charge" class="hidden"><i></i></div>
      <div id="click-to-play" class="hidden">Click to play</div>
      <div id="boss-bar" class="hidden" role="status"><div class="boss-name"></div><div class="boss-track"><div class="boss-fill"></div></div></div>
      <div id="bow-charge" class="hidden"><div></div></div>
      <div id="status-bars">
        <div id="armor-bar" class="stat-bar"></div>
        <div id="air-bar" class="stat-bar"></div>
        <div id="health-bar" class="stat-bar"></div>
        <div id="hunger-bar" class="stat-bar"></div>
      </div>
      <div id="effects" aria-hidden="true"></div>
      <div id="hotbar"></div>
      <div id="held-item-label"></div>
      <div id="debug-overlay" class="hidden"></div>
      <div id="fps-counter" class="hidden"></div>
      <div id="save-indicator" aria-hidden="true">Saving…</div>
      <div id="toasts" aria-live="polite"></div>
      <div id="inventory-hint" class="hidden"></div>
      <div id="touch-controls" class="hidden"></div>
      <div id="chat-log"></div>
      <div id="sleep-fade"><span>Sleeping…</span></div>
      <div id="chat-input-row" class="hidden"><input id="chat-input" autocomplete="off" spellcheck="false" maxlength="256" aria-label="Chat or command" placeholder="Type a message, or /help for commands" /></div>
    </div>
    <!-- Full-screen UI layers -->
    <div id="ui-root">
      <!-- shown until the game script loads; the menus replace it -->
      <div class="screen menu-bg boot-screen">
        <h1 class="title">BLOCKVERSE</h1>
        <p class="boot-note boot-loading">Loading…</p>
        <noscript><p class="boot-error-title">BlockVerse needs JavaScript</p><p class="boot-note">Turn JavaScript on for this site and reload the page.</p></noscript>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
